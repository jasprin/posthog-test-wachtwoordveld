<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen – Helder (prototype)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kaart">
    <header>
      <div class="merk"><span class="merk-logo" aria-hidden="true"></span><span class="merk-naam">Helder</span></div>
      <h1>Inloggen</h1>
      <p class="intro">Uw persoonlijke gezondheidsomgeving.</p>
    </header>

    <p id="laden" class="laden" role="status">Laden…</p>

    <!-- Geen action/method en geen name-attributen: het formulier verstuurt niets. -->
    <form id="inlogformulier" hidden novalidate autocomplete="off">
      <div class="veld">
        <label for="gebruikersnaam">Gebruikersnaam</label>
        <input id="gebruikersnaam" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>

      <div class="veld">
        <label for="wachtwoord">Wachtwoord</label>
        <div class="wachtwoordveld">
          <input id="wachtwoord" class="ph-no-capture" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
          <button id="toon-wachtwoord" class="oog" type="button" hidden
                  aria-label="Wachtwoord tonen" title="Wachtwoord tonen" aria-pressed="false" aria-controls="wachtwoord">
            <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
              <line class="streep" x1="3" y1="3" x2="21" y2="21"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="knop">Inloggen</button>
      <p class="waarschuwing">Prototype – vul geen echt wachtwoord in.</p>
      <a href="#" class="vergeten" onclick="event.preventDefault()">Wachtwoord vergeten?</a>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="posthog.js"></script>
  <script src="app.js"></script>
</body>
</html>
